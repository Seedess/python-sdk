[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seedess-sdk"
version = "0.1.0"
description = "Official Seedess SDK for Python. Create streams, mint playback tokens, read offload metrics."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Seedess", email = "hello@seedess.com" }]
keywords = ["seedess", "sdk", "video", "streaming", "p2p", "api"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://seedess.com/docs/libraries/"
Documentation = "https://seedess.com/docs/"
Repository = "https://github.com/Seedess/python-sdk"
Issues = "https://github.com/Seedess/python-sdk/issues"

[tool.setuptools.packages.find]
include = ["seedess_sdk*"]
